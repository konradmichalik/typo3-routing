services:
    _defaults:
        autowire: true
        autoconfigure: true
        public: false

    KonradMichalik\Typo3Routing\:
        resource: '../Classes/*'
        exclude:
            - '../Classes/Attribute/*'
            - '../Classes/Routing/RouteControllerInterface.php'
            - '../Classes/Authentication/RouteAuthenticatorInterface.php'

    # Arguments are injected at container compile time by RouteCompilerPass.
    KonradMichalik\Typo3Routing\Routing\RouteRegistry:
        autowire: false
        arguments:
            $routes: []
            $cacheConfigs: []

    # Public so the DataHandler cache-tag flusher (resolved via GeneralUtility::makeInstance) is DI-wired.
    KonradMichalik\Typo3Routing\Cache\CacheTagFlusher:
        public: true

    # Middleware services must be public so the TYPO3 middleware dispatcher can fetch them.
    KonradMichalik\Typo3Routing\Middleware\RouteDispatcher:
        public: true

    # Everything the dispatcher needs only *after* its path gate accepts a request. A locator, so none
    # of it is built for a request that never gets that far — which is every ordinary page request, and
    # was measured to be most of this extension's per-request cost. See the class docblock.
    KonradMichalik\Typo3Routing\Middleware\DispatcherServices:
        arguments:
            $services: !service_locator
                KonradMichalik\Typo3Routing\Routing\RouteMatcher: '@KonradMichalik\Typo3Routing\Routing\RouteMatcher'
                KonradMichalik\Typo3Routing\Cache\ResponseCacheManager: '@KonradMichalik\Typo3Routing\Cache\ResponseCacheManager'
                KonradMichalik\Typo3Routing\RateLimit\RateLimitCheck: '@KonradMichalik\Typo3Routing\RateLimit\RateLimitCheck'
                KonradMichalik\Typo3Routing\Routing\ControllerInvoker: '@KonradMichalik\Typo3Routing\Routing\ControllerInvoker'
                KonradMichalik\Typo3Routing\Authentication\AccessGuard: '@KonradMichalik\Typo3Routing\Authentication\AccessGuard'
                KonradMichalik\Typo3Routing\Http\CorsHandler: '@KonradMichalik\Typo3Routing\Http\CorsHandler'
                KonradMichalik\Typo3Routing\Http\CorsPreflightResolver: '@KonradMichalik\Typo3Routing\Http\CorsPreflightResolver'
                KonradMichalik\Typo3Routing\Cache\CacheBypassGuard: '@KonradMichalik\Typo3Routing\Cache\CacheBypassGuard'
                KonradMichalik\Typo3Routing\RateLimit\ClientKeyResolver: '@KonradMichalik\Typo3Routing\RateLimit\ClientKeyResolver'
                KonradMichalik\Typo3Routing\Http\RouteUrlGenerator: '@KonradMichalik\Typo3Routing\Http\RouteUrlGenerator'
                KonradMichalik\Typo3Routing\Routing\SiteLanguageScope: '@KonradMichalik\Typo3Routing\Routing\SiteLanguageScope'
                KonradMichalik\Typo3Routing\Http\DeprecationHeaders: '@KonradMichalik\Typo3Routing\Http\DeprecationHeaders'

    # Public so the routing:uri ViewHelper can fetch it from the container at render time.
    KonradMichalik\Typo3Routing\Http\RouteUrlGenerator:
        public: true

    # Public so consumers of the @api invocation seam can also reach it via makeInstance().
    KonradMichalik\Typo3Routing\Routing\RouteInvoker:
        public: true

    # Dedicated TYPO3 cache backing the rate-limiter bucket store.
    cache.typo3_routing_ratelimit:
        class: TYPO3\CMS\Core\Cache\Frontend\FrontendInterface
        factory: ['@TYPO3\CMS\Core\Cache\CacheManager', 'getCache']
        arguments: ['typo3_routing_ratelimit']

    KonradMichalik\Typo3Routing\RateLimit\CacheStorage:
        arguments:
            $cache: '@cache.typo3_routing_ratelimit'

    Symfony\Component\RateLimiter\Storage\StorageInterface:
        alias: KonradMichalik\Typo3Routing\RateLimit\CacheStorage

    KonradMichalik\Typo3Routing\Command\RouteDebugCommand:
        tags:
            - name: console.command
              command: 'routing:debug'
              description: 'List all registered attribute routes'

    KonradMichalik\Typo3Routing\Command\RouteMatchCommand:
        tags:
            - name: console.command
              command: 'routing:match'
              description: 'Simulate matching a request path against the registered attribute routes'

    KonradMichalik\Typo3Routing\Command\RouteLintCommand:
        tags:
            - name: console.command
              command: 'routing:lint'
              description: 'Audit registered attribute routes for common mistakes'

    KonradMichalik\Typo3Routing\Command\OpenApiCommand:
        tags:
            - name: console.command
              command: 'routing:openapi'
              description: 'Export all registered attribute routes as an OpenAPI 3.1 document'
